# Runs static analysis, Dart unit tests, and the Android build + native unit tests
name: Flutter testing

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - ".github/*"
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Keep in sync with the minimum Flutter version in pubspec.yaml
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    name: flutter build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: android build & native tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: 'temurin'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
      - name: Build example debug APK
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android unit tests
        working-directory: example/android
        run: |
          chmod +x gradlew
          ./gradlew :sunmi_scanner:testDebugUnitTest
